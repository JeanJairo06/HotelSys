{% if messages %}
<div class="toast-container app-toast-container">
    {% for message in messages %}
        <div class="toast app-toast text-bg-{{ message.tags|default:'info' }} border-0" role="alert" aria-live="assertive" aria-atomic="true" data-bs-delay="4500">
            <div class="d-flex">
                <div class="toast-body">
                    {% if message.tags == 'success' %}
                        <i class="bi bi-check-circle me-2" aria-hidden="true"></i>
                    {% elif message.tags == 'warning' %}
                        <i class="bi bi-exclamation-triangle me-2" aria-hidden="true"></i>
                    {% elif message.tags == 'error' or message.tags == 'danger' %}
                        <i class="bi bi-x-circle me-2" aria-hidden="true"></i>
                    {% else %}
                        <i class="bi bi-info-circle me-2" aria-hidden="true"></i>
                    {% endif %}
                    {{ message }}
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
            </div>
        </div>
    {% endfor %}
</div>
{% endif %}
